<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - CraveWave</title>
</head>
<body>
    <header role="banner">
        <h1>CraveWave</h1>
        <nav role="navigation" aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main role="main">
        <section>
            <h2>Contact Us</h2>
            <p>Do you have a question or some feedback? We would be very happy to hear from you!</p>
            <form action="/submit-contact" method="post">
                <fieldset>
                    <legend>Personal Details</legend>
                    
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" name="fullName" required aria-required="true">
                    
                    <label for="emailAddress">Email ID:</label>
                    <input type="email" id="emailAddress" name="emailAddress" required aria-required="true">
                    
                    <label for="phoneNumber">Phone Number:</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber">
                </fieldset>
                
                <fieldset>
                    <legend>Question Details</legend>
                    
                    <label for="inquiryType">What is your query?:</label>
                    <select id="inquiryType" name="inquiryType">
                        <option value="general">Simple Question</option>
                        <option value="support">Customer Help</option>
                        <option value="feedback">Feedback</option>
                        <option value="partnership">Business Team Up</option>
                    </select>
                    
                    <label for="messageBody">Your Message:</label>
                    <textarea id="messageBody" name="messageBody" rows="5" cols="40" required aria-required="true"></textarea>
                </fieldset>
                
                <button type="submit">Submit Now</button>
            </form>
        </section>
    </main>
    <footer role="contentinfo">
        <p>&copy; 2026 CraveWave. All rights reserved.</p>
    </footer>
</body>
</html>
